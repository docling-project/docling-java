# Codecov configuration for docling-java
# See: https://docs.codecov.com/docs/codecov-yaml

coverage:
  range: 70..100
  status:
    project:
      default:
        target: auto
        threshold: 1%
        if_not_found: success

comment:
  layout: "diff,flags,tree"
  behavior: default
  require_changes: false

flags:
  java17:
    carryforward: false
  java21:
    carryforward: false
  java25:
    carryforward: false

ignore:
  - "**/*Tests.java"
  - "**/*Test.java"
  - "**/test/**"
  - "docs/**"
  - "buildSrc/**"

