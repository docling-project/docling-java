# Codecov configuration for docling-java
# See: https://docs.codecov.com/docs/codecov-yaml

coverage:
  status:
    project:
      default:
        target: auto
        threshold: 1%
        informational: true
    patch:
      default:
        target: auto
        threshold: 1%
        informational: true

comment:
  layout: "reach,diff,tree"
  behavior: default
  require_changes: false

ignore:
  - "**/*Tests.java"
  - "**/*Test.java"
  - "**/test/**"
  - "docs/**"
  - "buildSrc/**"

